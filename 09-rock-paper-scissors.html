<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper scissors</title>
  </head>
  <body>
    <h1>Rock paper scissors</h1>
    <button
      onclick="
     playGame('rock')
     "
    >
      Rock ✊
    </button>
    <button
      onclick="
      playGame('paper')
     "
    >
      Paper 📃 🖐
    </button>
    <button
      onclick="
     playGame('scissors')
     "
    >
      Scissors ✂✌
    </button>
    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
    <button onclick="resetScore(), updateScore() ">Reset score</button>
    <script src="static/scripts/09-rock-paper-scissors.js"></script>
  </body>
</html>
