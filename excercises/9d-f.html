<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input onkeyup="" type="text" placeholder="Enter your name">
  <button onclick="displayInput()">Submit</button>
  <p class="js-info"></p>

  <script>
    function displayInput(){
      const name = document.querySelector('input').value;
      document.querySelector('.js-info').innerHTML = `Hello ${name}`;
    }
    function enterKey(event) {
      if (event.key === "Enter") {
        displayInput();
      }
    }
  </script>
</body>
</html>
