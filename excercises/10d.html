<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .gaming-button {
        border: none;
        padding: 10px 20px;
        border-radius: 2px;
        cursor: pointer;
      }
      .gaming-button.is-toggled {
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <button class="gaming-button">Gaming</button>
    <button class="gaming-button">Music</button>
    <button class="gaming-button">Tech</button>

    <script>
      // Select all buttons
      const gamingButtons = document.querySelectorAll(".gaming-button");

      // Loop through each button
      gamingButtons.forEach((button) => {
        button.addEventListener("click", () => {
          button.classList.toggle("is-toggled");
        });
      });
    </script>
  </body>
</html>
